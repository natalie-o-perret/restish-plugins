name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  build-test:
    name: ${{ matrix.plugin }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    strategy:
      matrix:
        plugin: [arazzo, pretty, progress]
        go: ["1.25", "1.26"]
        include:
          - plugin: arazzo
            coverage: 63
          - plugin: pretty
            coverage: 73
          - plugin: progress
            coverage: 70
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage
        if: matrix.go == '1.26'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v total="$total" -v threshold="${{ matrix.coverage }}" \
            'BEGIN { if (total+0 < threshold+0) exit 1 }'
  govulncheck:
    name: govulncheck (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    strategy:
      matrix:
        plugin: [arazzo, pretty, progress]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  lint-go:
    name: lint (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    strategy:
      matrix:
        plugin: [arazzo, pretty, progress]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.plugin }}
      - run: go mod verify
      - name: Check module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
  lint-commits:
    if: github.event_name == 'pull_request'
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-commits-conventional.yml@main
    permissions:
      pull-requests: read
  lint-json:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-json.yml@main
  lint-markdown:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-md.yml@main
  lint-yaml:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-yaml.yml@main
  codeql:
    uses: natalie-o-perret/.github/.github/workflows/reusable-codeql.yml@main
    with:
      language: go
      go-version-file: go.work
