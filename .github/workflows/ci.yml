name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  test:
    name: test (${{ matrix.plugin }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: arazzo
            coverage: 63
          - plugin: pretty
            coverage: 73
          - plugin: progress
            coverage: 70
    uses: natalie-o-perret/.github/.github/workflows/reusable-build-test-go.yml@main
    with:
      go-versions: '["1.25","1.26"]'
      go-version-latest: "1.26"
      coverage-threshold: ${{ matrix.coverage }}
      working-directory: ${{ matrix.plugin }}
      coverage-artifact-name: coverage-${{ matrix.plugin }}
      cache-dependency-path: ${{ matrix.plugin }}/go.sum

  lint:
    name: lint (${{ matrix.plugin }})
    strategy:
      fail-fast: false
      matrix:
        plugin: [arazzo, pretty, progress]
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-go.yml@main
    with:
      go-version-file: ${{ matrix.plugin }}/go.mod
      working-directory: ${{ matrix.plugin }}
      cache-dependency-path: ${{ matrix.plugin }}/go.sum

  codeql:
    name: codeql (${{ matrix.plugin }})
    strategy:
      fail-fast: false
      matrix:
        plugin: [arazzo, pretty, progress]
    uses: natalie-o-perret/.github/.github/workflows/reusable-codeql.yml@main
    with:
      language: go
      go-version-file: ${{ matrix.plugin }}/go.mod
      working-directory: ${{ matrix.plugin }}
      cache-dependency-path: ${{ matrix.plugin }}/go.sum
      category: /language:go/${{ matrix.plugin }}

  lint-commits:
    if: github.event_name == 'pull_request'
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-commits-conventional.yml@main
    permissions:
      pull-requests: read

  lint-json:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-json.yml@main

  lint-markdown:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-md.yml@main

  lint-yaml:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-yaml.yml@main

  required:
    name: ci
    if: always()
    needs: [test, lint, codeql, lint-commits, lint-json, lint-markdown, lint-yaml]
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          CODEQL: ${{ needs.codeql.result }}
          COMMITS: ${{ needs.lint-commits.result }}
          JSON: ${{ needs.lint-json.result }}
          MARKDOWN: ${{ needs.lint-markdown.result }}
          YAML: ${{ needs.lint-yaml.result }}
        run: |
          test "$TEST" = success
          test "$LINT" = success
          test "$CODEQL" = success
          test "$COMMITS" = success || test "$COMMITS" = skipped
          test "$JSON" = success
          test "$MARKDOWN" = success
          test "$YAML" = success
